<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carOS - Dashboard Tesla Style</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #181818;
            --accent-color: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Painel Lateral (Controlo do Carro) */
        .sidebar {
            width: 35%;
            background-color: var(--panel-bg);
            border-right: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* Ecrã Principal (Navegação / Apps) */
        .main-screen {
            width: 65%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%);
        }

        /* Status de Condução */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
        }

        .gears {
            font-weight: bold;
            letter-spacing: 10px;
        }

        .gear {
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .gear.active {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .speedo {
            text-align: center;
            margin: 40px 0;
        }

        .speed-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
        }

        .speed-unit {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Controlos Interativos */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            background-color: #242424;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn:active, .btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Barra de Informação Inferior */
        .dock {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .dock-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }

        .temp-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .temp-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .notification {
            background-color: rgba(59, 130, 246, 0.2);
            border: 1px solid var(--accent-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- PAINEL DE CONDUÇÃO (ESQUERDA) -->
    <div class="sidebar">
        <div>
            <div class="notification" id="notification">Sistema Pronto • carOS ativo</div>
            
            <div class="status-header">
                <div class="gears">
                    <span class="gear" id="gear-P">P</span>
                    <span class="gear" id="gear-R">R</span>
                    <span class="gear" id="gear-N">N</span>
                    <span class="gear active" id="gear-D">D</span>
                </div>
                <div id="lights-status">💡 Off</div>
            </div>

            <div class="speedo">
                <div class="speed-value" id="speed">0</div>
                <div class="speed-unit">km/h</div>
            </div>
        </div>

        <!-- Botões de Ação do Carro -->
        <div>
            <h3>Controlos do Veículo</h3>
            <div class="controls-grid">
                <button class="btn" id="btn-gas">Acelerar ⚡</button>
                <button class="btn" id="btn-brake">Travar 🛑</button>
                <button class="btn" id="btn-lights">Luzes 💡</button>
                <button class="btn" id="btn-lock">Trancar 🔒</button>
            </div>
        </div>
    </div>

    <!-- ECRÃ CENTRAL (DIREITA) -->
    <div class="main-screen">
        <div style="text-align: center; margin-top: 50px;">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">📍 Lisboa, Portugal</h1>
            <p style="color: var(--text-muted);" id="live-clock">00:00:00</p>
        </div>

        <!-- Barra de Status e Climatização Inferior -->
        <div class="dock">
            <div class="dock-item">
                <span>🔋</span>
                <span id="battery-status">87%</span>
                <span style="color: var(--text-muted); font-size: 0.9rem;" id="range-status">(412 km)</span>
            </div>

            <div class="dock-item temp-control">
                <button class="temp-btn" id="temp-down">-</button>
                <span id="temp-display">21.5°C</span>
                <button class="temp-btn" id="temp-up">+</button>
            </div>

            <div class="dock-item">
                <span style="font-size: 0.9rem; color: var(--text-muted);">Definições do carOS</span>
            </div>
        </div>
    </div>

    <script>
        // --- ESTADO DA APLICAÇÃO ---
        let currentSpeed = 0;
        let currentGear = 'D';
        let lightsOn = false;
        let carLocked = false;
        let temperature = 21.5;
        let battery = 87;
        let isAccelerating = false;
        let speedInterval;

        // --- ELEMENTOS DO DOM ---
        const speedEl = document.getElementById('speed');
        const notificationEl = document.getElementById('notification');
        const lightsStatusEl = document.getElementById('lights-status');
        const clockEl = document.getElementById('live-clock');
        const tempDisplayEl = document.getElementById('temp-display');
        const batteryStatusEl = document.getElementById('battery-status');
        const rangeStatusEl = document.getElementById('range-status');

        // --- RELÓGIO EM TEMPO REAL ---
        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('pt-PT');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- LÓGICA DE VELOCIDADE (ACELERAR / TRAVAR) ---
        function updatePhysics() {
            if (isAccelerating && currentGear === 'D') {
                if (currentSpeed < 250) currentSpeed += 4;
                // Consome bateria ligeiramente ao correr
                if (Math.random() > 0.7 && battery > 1) {
                    battery--;
                    updateBatteryUI();
                }
            } else if (isAccelerating && currentGear === 'R') {
                if (currentSpeed > -40) currentSpeed -= 2;
            } else {
                // Desaceleração natural
                if (currentSpeed > 0) currentSpeed -= 2;
                if (currentSpeed < 0) currentSpeed += 2;
                if (Math.abs(currentSpeed) <= 1) currentSpeed = 0;
            }
            speedEl.textContent = Math.abs(currentSpeed);
        }
        setInterval(updatePhysics, 50);

        // Eventos dos botões físicos/toque
        const gasBtn = document.getElementById('btn-gas');
        const brakeBtn = document.getElementById('btn-brake');

        gasBtn.addEventListener('mousedown', () => { isAccelerating = true; gasBtn.classList.add('active'); });
        gasBtn.addEventListener('mouseup', () => { isAccelerating = false; gasBtn.classList.remove('active'); });
        gasBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isAccelerating = true; gasBtn.classList.add('active'); });
        gasBtn.addEventListener('touchend', () => { isAccelerating = false; gasBtn.classList.remove('active'); });

        brakeBtn.addEventListener('mousedown', () => { 
            isAccelerating = false; 
            currentSpeed = Math.getInteger ? 0 : Math.round(currentSpeed * 0.4); 
            if(Math.abs(currentSpeed) < 3) currentSpeed = 0;
            brakeBtn.classList.add('active');
        });
        brakeBtn.addEventListener('mouseup', () => brakeBtn.classList.remove('active'));

        // --- ALTERAR MUDANÇAS (P, R, N, D) ---
        const gears = ['P', 'R', 'N', 'D'];
        gears.forEach(gear => {
            document.getElementById(`gear-${gear}`).addEventListener('click', () => {
                if (currentSpeed !== 0) {
                    showNotification("Trave completamente o veículo antes de mudar de mudança!");
                    return;
                }
