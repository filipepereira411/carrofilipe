<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carOS - Dashboard Tesla Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr;
            grid-template-rows: 1fr 70px;
            overflow: hidden;
        }

        /* Painel Lateral Esquerdo (Visualização do Carro) */
        .car-status {
            background-color: #111;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }

        .gear-selector {
            font-size: 24px;
            font-weight: bold;
            color: #444;
            letter-spacing: 15px;
        }

        .gear-selector .active {
            color: #fff;
        }

        .speedometer {
            text-align: center;
            margin-top: -40px;
        }

        .speed-number {
            font-size: 90px;
            font-weight: 300;
            line-height: 1;
        }

        .speed-unit {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .car-avatar {
            width: 80%;
            height: auto;
            opacity: 0.85;
            transition: transform 0.3s;
        }

        .car-avatar:hover {
            transform: scale(1.05);
        }

        .battery-status {
            font-size: 18px;
            color: #00e676;
            font-weight: 500;
        }

        /* Área Principal (Mapa / Navegação) */
        .main-map {
            background-color: #1a1a1a;
            position: relative;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-placeholder {
            color: #555;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Barra de Informação Superior no Mapa */
        .top-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .card {
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            pointer-events: auto;
        }

        /* Barra de Menu Inferior (Dock) */
        .bottom-dock {
            grid-column: 1 / -1;
            background-color: #0a0a0a;
            border-top: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .dock-icon {
            font-size: 24px;
            color: #888;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .dock-icon:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .dock-icon.climate {
            color: #ff5252; /* Temperatura ativa */
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Painel Lateral: Estado do Veículo -->
    <section class="car-status">
        <div class="gear-selector">
            <span class="active">P</span><span>R</span><span>N</span><span>D</span>
        </div>

        <div class="speedometer">
            <div class="speed-number">0</div>
            <div class="speed-unit">km/h</div>
        </div>

        <!-- Render simples de um capô/carro minimalista usando SVG -->
        <svg class="car-avatar" viewBox="0 0 100 180" fill="none" xmlns="http://w3.org">
            <rect x="25" y="20" width="50" height="140" rx="25" fill="#222" stroke="#444" stroke-width="2"/>
            <rect x="28" y="50" width="44" height="40" rx="10" fill="#111"/>
            <path d="M30 110 H70" stroke="#444" stroke-width="3"/>
        </svg>

        <div class="battery-status">🔋 87% • 412 km</div>
    </section>

    <!-- Área Central: Sistema de Navegação / Aplicações -->
    <main class="main-map">
        <div class="top-overlay">
            <div class="card">📍 Destino: Lisboa, Portugal</div>
            <div class="card">14:35</div>
        </div>
        <div class="map-placeholder">Módulo de Mapa Interativo</div>
    </main>

    <!-- Dock Inferior: Controlos Globais -->
    <nav class="bottom-dock">
        <div class="dock-icon">🚗</div>
        <div class="dock-icon">🎵</div>
        <div class="dock-icon climate">21.5°C</div>
        <div class="dock-icon">🗂️</div>
        <div class="dock-icon">⚙️</div>
    </nav>

</body>
</html>
